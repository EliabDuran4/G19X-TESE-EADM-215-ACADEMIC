groups:
  - name: proceso_documental
    rules:
      - alert: DocumentosSinRevisar
        expr: max(documents_by_status_ratio{status="recibido"}) > 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Más de 10 documentos esperan revisión"
          description: "Hay {{ $value }} documentos en estado recibido desde hace más de 10 minutos."

      - alert: DocumentosEstancadosEnRevision
        expr: max(documents_by_status_ratio{status="en_revision"}) > 10
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Cuello de botella en revisión"
          description: "Hay {{ $value }} documentos en en_revision desde hace más de 30 minutos."

      - alert: DocumentosEnCorreccion
        expr: max(documents_by_status_ratio{status="correccion"}) > 5
        for: 30m
        labels:
          severity: info
        annotations:
          summary: "Muchos documentos esperan corrección"
          description: "Hay {{ $value }} documentos en correccion."

      - alert: DecisionLenta
        expr: histogram_quantile(0.95, sum by (le) (increase(document_decision_duration_seconds_bucket[1h]))) > 86400
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "El p95 de decisión supera 24 horas"
          description: "El 95% de las decisiones de la última hora tardó menos de {{ $value | humanizeDuration }}."

      - alert: ColectorCaido
        expr: up{job="otel-collector"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus no puede leer el OTel Collector"
          description: "Sin métricas del proceso documental."
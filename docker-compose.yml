services:

  ollama:
    image: ollama/ollama:latest
    profiles: ["ia-local"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?define KEYCLOAK_ADMIN_PASSWORD en .env}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?define KEYCLOAK_CLIENT_SECRET en .env}
    ports:
      - "8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak:/opt/keycloak/data/import:ro
    networks:
      - observabilidad-net

  sqlserver_documental:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver_documental
    mem_limit: 2300m
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?define MSSQL_SA_PASSWORD en .env}
    ports:
      - "1438:1433"
    volumes:
      - sqlserver_documental_data:/var/opt/mssql
    networks:
      - observabilidad-net

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    networks:
      - observabilidad-net

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml
    ports:
      - "9090:9090"
    networks:
      - observabilidad-net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?define GRAFANA_ADMIN_PASSWORD en .env}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - observabilidad-net
    depends_on:
      - prometheus

  backend:
    build: ./backend
    container_name: backend
    env_file:
      - path: ./.env
        required: false
    environment:
      DATABASE_URL_DOCUMENTAL: ${DATABASE_URL_DOCKER:?define DATABASE_URL_DOCKER en .env}
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_PUBLIC_URL: http://localhost:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OLLAMA_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads
    networks:
      - observabilidad-net
    depends_on:
      - sqlserver_documental
      - keycloak
      - otel-collector
  reporting-service:
    build: ./reporting-service
    container_name: reporting-service
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      DATABASE_URL_REPORTING: mssql+pyodbc://reporting_ro:${REPORTING_DB_PASSWORD:?define REPORTING_DB_PASSWORD en .env}@sqlserver_documental:1433/observabilidad_documental?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes
    networks:
      - observabilidad-net
    depends_on:
      - sqlserver_documental
      - otel-collector

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "5173:5173"
    networks:
      - observabilidad-net
    depends_on:
      - backend

networks:
  observabilidad-net:
    driver: bridge

volumes:
  keycloak_data:
  sqlserver_documental_data:
  ollama_data:
  grafana_data:
  uploads_data: